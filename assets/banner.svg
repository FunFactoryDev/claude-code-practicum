<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Claude Code practicum — 14 tasks with automatic checking">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1a1d23" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="30%" r="55%">
      <stop offset="0" stop-color="#34d399" stop-opacity=".22"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono{font-family:'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:Inter,-apple-system,'Segoe UI',Roboto,sans-serif}
      .cursor{animation:blink 1.1s steps(1) infinite}
      .gear{transform-origin:1068px 160px;animation:spin 18s linear infinite}
      .spark{animation:pulse 2.4s ease-in-out infinite}
      @keyframes blink{50%{opacity:0}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.cursor,.gear,.spark{animation:none}}
    </style>
  </defs>
  <rect width="1280" height="320" rx="20" fill="#0a0b0d"/>
  <rect width="1280" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="20" fill="url(#glow)"/>
  <circle cx="44" cy="40" r="7" fill="#f87171"/><circle cx="68" cy="40" r="7" fill="#fbbf24"/><circle cx="92" cy="40" r="7" fill="#34d399"/>
  <text x="64" y="118" class="mono" font-size="22" fill="#34d399">$ npm run check   ✓ 14 of 14</text>
  <text x="62" y="196" class="sans" font-size="64" font-weight="700" fill="#e8eaed" letter-spacing="-1.5"><tspan fill="#34d399">Claude Code</tspan> practicum</text>
  <rect x="718" y="146" width="16" height="52" fill="#34d399" class="cursor"/>
  <text x="64" y="252" class="sans" font-size="24" fill="#9aa1ac">14 tasks on a real project · checked with one command</text>
  <g class="gear" fill="none" stroke="#34d399" stroke-width="10" stroke-linejoin="round" opacity=".9">
    <circle cx="1068" cy="160" r="54"/>
    <path d="M1068 86v-22M1068 256v-22M994 160h-22M1164 160h-22M1016 108l-16-16M1136 228l-16-16M1016 212l-16 16M1136 92l-16 16"/>
  </g>
  <path class="spark" d="M1068 128l9 23 23 9-23 9-9 23-9-23-23-9 23-9z" fill="#34d399"/>
</svg>
